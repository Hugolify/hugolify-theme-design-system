module:
  mounts:
    # Copy CSS and JS
    - source: assets
      target: assets

# Params
params:

  # PostCSS config, provided by this module (mounted in assets/_jsconfig).
  # CommonJS (.cjs) so its plugins resolve from the project's node_modules
  # on any Hugo version: see the header of postcss.config.cjs.
  css:
    postcss: "postcss.config.cjs"

  # Grid
  column: 
    mobile: 1
    tablet: 1
    desktop: 12
  container:
    desktop: 1440
    mobile: 375
  gap:
    desktop: 30
    mobile: 30
  gutter:
    desktop: 60
    mobile: 30

  # Load JS
  animation: false # Load js and add data attributes
  carousel: true # Load splidejs
  map: true # Load leaflet
  parallax:
    enable: false # Load js and add data attributes
    cover: -2
    heading: -0.25
    percentage: 0.5
  vimeo: false
  youtube: false
